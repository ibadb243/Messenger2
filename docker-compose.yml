services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: my_api
    depends_on:
      - mssql
      - cassandra
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Пароль в строке подключения должен совпадать с MSSQL_SA_PASSWORD выше.
      ConnectionStrings__MsSqlServer: "Server=mssql,1433;Database=messenger;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      Cassandra__Hosts__0: cassandra
      Cassandra__Port: 9042
      Cassandra__Keyspace: messenger
      Cassandra__TruncateTimeoutMs: 60000
      Serilog__MinimumLevel__Default: Information
      Jwt__Secret: "change-me-to-a-long-random-string-at-least-32-chars"
      Jwt__Issuer: Messenger2
      Jwt__Audience: Messenger2
      Jwt__ExpiresMinutes: 60

  syncer:
    build:
      context: .
      dockerfile: Syncer/Dockerfile
    container_name: my_syncer
    depends_on:
      - mssql
      - cassandra
    restart: on-failure
    environment:
      DOTNET_ENVIRONMENT: Production
      # Пароль в строке подключения должен совпадать с MSSQL_SA_PASSWORD выше.
      ConnectionStrings__MsSqlServer: "Server=mssql,1433;Database=messenger;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      Cassandra__Hosts__0: cassandra
      Cassandra__Port: 9042
      Cassandra__Keyspace: messenger
      Cassandra__TruncateTimeoutMs: 60000
      Sync__IntervalSeconds: 5
      Sync__ParallelDegree: 5
      Serilog__MinimumLevel__Default: Information
