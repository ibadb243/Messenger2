services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      default:

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    networks:
      default:

  app:
    build:
      context: .
      dockerfile: Messenger2/Dockerfile
    container_name: my_app
    depends_on:
      - mssql
      - cassandra
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__MsSqlServer=Server=mssql,1433;Database=messenger;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - Sync__CassandraHosts__0=cassandra
    networks:
      default:
 
networks:
  default:
    driver: bridge