name: messenger2

# ---- Общие блоки ----
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-mssql-auth: &mssql-auth
  MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"

# Настройки .NET-сервисов, общие для api и syncer.
x-app-env: &app-env
  # Пароль в строке подключения должен совпадать с MSSQL_SA_PASSWORD выше.
  ConnectionStrings__MsSqlServer: "Server=mssql,1433;Database=messenger;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
  Cassandra__Hosts__0: cassandra
  Cassandra__Port: 9042
  Cassandra__Keyspace: messenger
  Cassandra__TruncateTimeoutMs: 60000
  Serilog__MinimumLevel__Default: Information

services:
  # ---------- Хранилища ----------
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      <<: *mssql-auth
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [messenger]

  cassandra:
    image: cassandra:4.1
    environment:
      # Ограничиваем память JVM, чтобы Cassandra не съедала весь хост.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    networks: [messenger]

  # ---------- Одноразовая инициализация схем (скрипты идемпотентны) ----------
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      <<: *mssql-auth
    volumes:
      - ./mssql.sql:/init/mssql.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /init/mssql.sql"]
    restart: "no"
    logging: *default-logging
    networks: [messenger]

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cas.cql:/init/cas.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/init/cas.cql"]
    restart: "no"
    logging: *default-logging
    networks: [messenger]

  # ---------- Приложения ----------
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Development #Production
      Jwt__Secret: "change-me-to-a-long-random-string-at-least-32-chars"
      Jwt__Issuer: Messenger2
      Jwt__Audience: Messenger2
      Jwt__ExpiresMinutes: 60
    volumes:
      - api-logs:/app/logs
    healthcheck:
      # В образе aspnet нет curl, поэтому HTTP-запрос делаем средствами bash (CMD-SHELL здесь — это sh без /dev/tcp).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [messenger]

  syncer:
    build:
      context: .
      dockerfile: Syncer/Dockerfile
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DOTNET_ENVIRONMENT: Production
      Sync__IntervalSeconds: 5
      Sync__ParallelDegree: 5
    volumes:
      - syncer-logs:/app/logs
    restart: unless-stopped
    logging: *default-logging
    networks: [messenger]

volumes:
  mssql-data:
  cassandra-data:
  api-logs:
  syncer-logs:

networks:
  messenger:
    driver: bridge
